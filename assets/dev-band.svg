  <defs>
    <clipPath id="tile">
      <rect x="66" y="66" width="892" height="892" rx="200"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="806" width="1024" height="160" fill="#22C55E"/>
  </g>
  <text x="512" y="916" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="118" letter-spacing="22" fill="#0b1a10">DEV</text>
</svg>
