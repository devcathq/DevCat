[package]
name = "devcat-rooms"
version = "0.1.0"
edition = "2024"
description = "DevCat rooms: people on their own networks share documents, a discussion thread and their agents, peer to peer over iroh"
publish = false

[dependencies]
iroh = { version = "1.3.0", default-features = false, features = ["tls-aws-lc-rs", "fast-apple-datapath", "portmapper"] }
iroh-gossip = "0.101"
loro = "1.17"
devcat-remote-proto = { path = "../remote-proto" }
chacha20poly1305 = "0.10"
blake3 = "1"
rand = "0.9"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
n0-future = "0.3"
parking_lot = "0.12"
similar = "2"
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
