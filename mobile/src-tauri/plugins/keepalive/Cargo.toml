[package]
name = "tauri-plugin-devcat-keepalive"
version = "0.1.0"
description = "DevCat Mobile: stay connected in the background on Android (a foreground service)"
edition = "2024"
publish = false
links = "tauri-plugin-devcat-keepalive"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
