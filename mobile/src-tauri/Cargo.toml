[package]
name = "devcat-mobile"
version = "0.1.0"
description = "DevCat Mobile: control DevCat on your computer from your phone"
authors = ["DevCat"]
edition = "2024"
publish = false

[lib]
name = "devcat_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
parking_lot = "0.12"
hex = "0.4"
getrandom = "0.3"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
devcat-remote-proto = { path = "../../crates/remote-proto" }
n0-future = "0.3"
# libc 0.2.184+ exposes the routing / in6_ifreq items iroh's network monitor (netwatch, netdev)
# uses on iOS for macOS only, so the iOS build breaks. Lift the pin once they adapt.
libc = "=0.2.183"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"

[profile.dev.package."*"]
debug = false

