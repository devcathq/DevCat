# Tests and lints crates/rooms (rooms: shared documents, thread and agents, peer to peer) on
# every OS, when it changes. The tests run real iroh endpoints on localhost, so all three run.
name: rooms

on:
  pull_request:
    paths: ["crates/rooms/**", ".github/workflows/harness.yml"]
  push:
    branches: [master]
    paths: ["crates/rooms/**", ".github/workflows/harness.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/rooms
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/rooms -> target
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
