# Publishes the hosted browser version of DevCat Mobile (mobile/, `--mode hosted`) on GitHub
# Pages: https://devcathq.github.io/DevCat/. DevCat's pairing QR code opens it when relays are on;
# it reaches the computer through the relay with mobile/web-iroh (WebAssembly).
# Also serves the install scripts (scripts/install.sh, install.ps1) and the landing page with the docs
# (site/, at /home/ and /home/docs/).
# Runs on version tags and manually. Repository settings → Pages → Source: GitHub Actions.
name: pages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/web-iroh -> target
          key: wasm
      # The JS bindings generator must match the wasm-bindgen version in mobile/web-iroh/Cargo.lock.
      - name: Install wasm-bindgen
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' mobile/web-iroh/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASM_BINDGEN=$RUNNER_TEMP/wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: mobile/web-iroh/build.sh
      - run: pnpm mobile:hosted
      # curl -fsSL https://devcathq.github.io/DevCat/install.sh | sh (and install.ps1 for Windows)
      - run: cp scripts/install.sh scripts/install.ps1 mobile/dist-hosted/
      # The landing page (site/) at https://devcathq.github.io/DevCat/home/ and the docs at /home/docs/.
      # The root stays the mobile web app, so pairing QR links keep working.
      - run: site/build.sh mobile/dist-hosted/home
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist-hosted

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
