# Builds DevCat installers for macOS (Apple Silicon + Intel), Windows and Linux.
# Merging a release PR (branch `release/vX.Y.Z`) runs it on the new tag `vX.Y.Z` (release.yml),
# which publishes a GitHub release with the installers attached. Pushing a tag like `v0.1.0`
# does the same; run it manually from the Actions tab to get them as workflow artifacts.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # The release notes: this version's section of CHANGELOG.md, then how to download
  # (scripts/release-notes.sh). The release and latest.json (the app's update dialog) use them.
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          { echo "body<<DEVCAT_NOTES_EOF"; scripts/release-notes.sh "$version"; echo "DEVCAT_NOTES_EOF"; } >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            args: ""
            rust_targets: ""
            label: windows-x64
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            label: linux-x64
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}
      - run: pnpm install --frozen-lockfile

      # The OpenVPN DevCat ships on macOS (scripts/build-openvpn-macos.sh, run by the macOS
      # beforeBuildCommand). Rebuilt only when the script (versions / pins) changes.
      - name: Cache the bundled OpenVPN (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: src-tauri/vpn-bin
          key: openvpn-${{ matrix.label }}-${{ hashFiles('scripts/build-openvpn-macos.sh') }}

      # macOS release signing with DevCat's self-signed certificate (.github/devcat-codesign.crt;
      # the .p12 is a repository secret). Unlike ad-hoc signing, the signature's identity stays the
      # same across versions, so the Keychain keeps "Always Allow" for saved passwords after an
      # update. Not notarized: Gatekeeper still asks once on first install. Without the secret the
      # build stays ad-hoc signed.
      - name: Set up code signing (macOS)
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          scripts/ci-macos-signing.sh setup
          echo "APPLE_SIGNING_IDENTITY=DevCat Self-Signed" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app verifies them with the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DevCat ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          # latest.json: what the in-app updater reads (releases/latest/download/latest.json)
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Check the macOS signature
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        run: |
          app=$(find src-tauri/target -maxdepth 6 -path '*/release/bundle/macos/DevCat.app' | head -1)
          codesign --verify --deep --strict "$app"
          req=$(codesign -d -r- "$app" 2>&1)
          echo "$req"
          # self-signed: the certificate is its own root; check it's ours by fingerprint
          echo "$req" | grep -qi 'certificate root = H"ae681e9b28c61cdcce19d63e05a6aac8a67f637d"' || { echo "::error::DevCat.app is not signed with the release certificate"; exit 1; }

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        run: scripts/ci-macos-signing.sh cleanup

      # The bundled OpenVPN: inside the app, right architecture, only system libraries linked
      # (the passwordless helper runs it as root), and on Apple Silicon a loopback connection
      # between two instances with LZO compression.
      - name: Check the bundled OpenVPN (macOS)
        if: runner.os == 'macOS'
        run: |
          arch=${{ matrix.label == 'macos-arm64' && 'arm64' || 'x86_64' }}
          app=$(find src-tauri/target -maxdepth 6 -path '*/release/bundle/macos/DevCat.app' | head -1)
          bin="$PWD/$app/Contents/Resources/vpn/openvpn"   # absolute: the loopback test runs in $RUNNER_TEMP
          test -x "$bin" || { echo "::error::$bin is missing"; exit 1; }
          test -x "$(dirname "$bin")/dns-updown" || { echo "::error::the DNS script is missing"; exit 1; }
          grep -aq /Library/PrivilegedHelperTools/dev.devcat.vpn-scripts/dns-updown "$bin" || { echo "::error::wrong default DNS script path"; exit 1; }
          lipo -archs "$bin" | grep -qx "$arch"
          if otool -L "$bin" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then echo "::error::non-system library linked"; exit 1; fi
          if [ "$arch" = arm64 ]; then
            "$bin" --version | head -1
            cd "$RUNNER_TEMP" && "$bin" --genkey secret s.key
            common="--dev null --secret s.key --allow-deprecated-insecure-static-crypto --cipher AES-256-CBC --auth SHA256 --comp-lzo --proto udp --verb 3 --ping 1"
            "$bin" $common --lport 51194 --rport 51195 --remote 127.0.0.1 > a.log 2>&1 & a=$!
            "$bin" $common --lport 51195 --rport 51194 --remote 127.0.0.1 > b.log 2>&1 & b=$!
            sleep 8; kill $a $b || true
            cat a.log
            grep -q "Initialization Sequence Completed" a.log && grep -q "Initialization Sequence Completed" b.log
            grep -q "compression: 'lzo'" a.log
          fi

      # The OpenVPN / WireGuard installers DevCat ships for Windows: present in the app's
      # resources, and they install with the same options DevCat uses (no OpenVPN tray app).
      - name: Check the bundled VPN installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $m = Get-Content src-tauri/vpn-installers.json -Raw | ConvertFrom-Json
          foreach ($tool in 'openvpn', 'wireguard') {
            $t = $m.$tool
            $name = Split-Path $t.files.x64.url -Leaf
            $msi = Get-ChildItem -Recurse -File src-tauri/target -Filter $name | Where-Object { $_.FullName -match '[\\/]vpn-installers[\\/]' } | Select-Object -First 1
            if (-not $msi) { throw "$name is not in the app's resources" }
            $log = Join-Path $env:RUNNER_TEMP "$tool.log"
            $msiArgs = @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`"") + $t.msiProperties
            $p = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010) { Get-Content $log -Tail 60; throw "$tool installer exited with $($p.ExitCode)" }
            Write-Host "$tool $($t.version): installed (exit $($p.ExitCode))"
          }
          & "$env:ProgramFiles\OpenVPN\bin\openvpn.exe" --version | Select-Object -First 1
          if (-not (Test-Path "$env:ProgramFiles\WireGuard\wireguard.exe")) { throw "wireguard.exe is missing" }
          if (Test-Path "$env:ProgramFiles\OpenVPN\bin\openvpn-gui.exe") { throw "The OpenVPN GUI was installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: devcat-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  # DevCat CLI: `devcat serve` without the app (no Tauri / WebKit / GTK), for servers and
  # terminal installs (scripts/install.sh, Homebrew). Assets have no version in their names, so
  # releases/latest/download/devcat-cli-<target>.tar.gz always gets the newest.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos-latest, target: x86_64-apple-darwin }
          - { platform: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform }}
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: cli-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The browser version phones open is served by `devcat serve` (embedded at build time).
      - run: pnpm mobile:web
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked --no-default-features --bin devcat --target ${{ matrix.target }}

      # Same self-signed identity as the app: the Keychain keeps "Always Allow" across updates.
      - name: Sign (macOS)
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          scripts/ci-macos-signing.sh setup
          bin=src-tauri/target/${{ matrix.target }}/release/devcat
          codesign -f -s "DevCat Self-Signed" --identifier dev.devcat.cli "$bin"
          codesign --verify --strict "$bin"

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        run: scripts/ci-macos-signing.sh cleanup

      - name: Package
        shell: bash
        run: |
          t=${{ matrix.target }}; out="$RUNNER_TEMP/out"; mkdir -p "$out"
          dir="src-tauri/target/$t/release"
          if [ "$RUNNER_OS" = Windows ]; then
            "$dir/devcat.exe" version
            (cd "$dir" && 7z a "$out/devcat-cli-$t.zip" devcat.exe > /dev/null)
            f="devcat-cli-$t.zip"
          else
            [ "$t" = x86_64-apple-darwin ] || "$dir/devcat" version   # (Intel build on an Apple Silicon runner: Rosetta may be missing)
            tar -czf "$out/devcat-cli-$t.tar.gz" -C "$dir" devcat
            f="devcat-cli-$t.tar.gz"
          fi
          (cd "$out" && { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; } > "$f.sha256" && cat "$f.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: devcat-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*

  # Attach the CLI to the release (after the app jobs, which create it) and publish
  # SHA256SUMS.txt for every asset (the Homebrew tap reads it).
  publish-cli:
    needs: [build, cli]
    if: ${{ !cancelled() && needs.cli.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: devcat-cli-*
          merge-multiple: true
          path: cli
      - name: Upload
        run: |
          for i in $(seq 1 30); do gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" cli/* --clobber -R "$GITHUB_REPOSITORY"
          mkdir all && cd all
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --skip-existing -p '*.dmg' -p '*.app.tar.gz' -p '*.AppImage' -p '*.deb' -p '*.rpm' -p '*.exe' -p '*.msi' -p 'devcat-cli-*' -p '*.apk'
          sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
