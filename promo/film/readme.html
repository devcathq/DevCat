<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f1114; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: -apple-system, "SF Pro Display", "Inter", "Segoe UI", sans-serif; color: #e6e8ec; }
      .clip { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1300px 800px at 85% -10%, #241d10 0%, #0f1114 55%); }
      .win { position: absolute; left: 150px; top: 26px; width: 1620px; border-radius: 18px; overflow: hidden; border: 1px solid #2a2f39; box-shadow: 0 30px 100px rgba(0,0,0,.6); }
      .win img { display: block; width: 100%; }
      .cap { position: absolute; left: 110px; bottom: 44px; font-size: 34px; font-weight: 700; background: rgba(15,17,20,.92); border: 1px solid #3a404c; padding: 14px 24px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
      .cap span { color: #8b93a3; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="readme" data-start="0" data-duration="33" data-width="1920" data-height="1080">
      <section id="a" class="clip" data-start="0" data-duration="3.5"><div class="win" id="a-w"><img src="assets/ai.png" alt=""></div><div class="cap" id="a-c">AI workspace <span>· Claude Code, Codex, Gemini or DevCat Agent</span></div></section>
      <section id="b" class="clip" data-start="3.5" data-duration="3"><div class="win" id="b-w"><img src="assets/diff.png" alt=""></div><div class="cap" id="b-c">Review <span>· what the agent changed</span></div></section>
      <section id="c" class="clip" data-start="6.5" data-duration="4"><div class="win" id="c-w"><img src="assets/agent.png" alt=""></div><div class="cap" id="c-c">Ask a connection <span>· query, dump, export</span></div></section>
      <div id="d" data-composition-id="rooms" data-composition-src="compositions/rooms.html" data-start="10.5" data-duration="9"></div>
      <div id="e" data-composition-id="phone" data-composition-src="compositions/phone.html" data-start="19.5" data-duration="8.5"></div>
      <section id="f" class="clip" data-start="28" data-duration="2.5"><div class="win" id="f-w"><img src="assets/git.png" alt=""></div><div class="cap" id="f-c">Git <span>· every repo in a folder</span></div></section>
      <section id="g" class="clip" data-start="30.5" data-duration="2.5"><div class="win" id="g-w"><img src="assets/k8s.png" alt=""></div><div class="cap" id="g-c">Kubernetes <span>· workloads, logs, shells</span></div></section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // each screen: on screen at its first frame, a slow push in, its caption, a short fade out
      const shot = (id, start, dur, first) => {
        if (!first) tl.fromTo(`#${id}-w`, { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, start);
        tl.to(`#${id}-w`, { scale: 1.025, duration: dur - 0.5, ease: "none" }, start + 0.45);
        if (!first) tl.fromTo(`#${id}-c`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, start + 0.35);
        tl.to(`#${id}`, { opacity: 0, duration: 0.3 }, start + dur - 0.3);
      };
      shot("a", 0, 3.5, true);
      shot("b", 3.5, 3);
      shot("c", 6.5, 4);
      shot("f", 28, 2.5);
      shot("g", 30.5, 2.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["readme"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
