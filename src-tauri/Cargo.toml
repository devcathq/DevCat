[package]
name = "devcat"
version = "0.1.0"
description = "DevCat - database, Kubernetes and RabbitMQ client"
authors = ["DevCat"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The app with its windows. Without it (`cargo build --no-default-features`): the CLI alone
# (`devcat serve`), with no Tauri / WebKit / GTK, for servers and terminal-only installs.
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance", "dep:clipboard-rs", "dep:fontdb"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# Files on the OS clipboard (Copy in the Files tree), like Explorer / Finder.
clipboard-rs = { version = "0.3.5", default-features = false, optional = true }
# Installed font families for the font pickers (Appearance → Fonts).
fontdb = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
anyhow = "1.0.104"
futures = "0.3.34"
dirs = "7.0.0"
base64 = "0.23.1"
hex = "0.4.3"
sha2 = "0.11"
once_cell = "1.21.4"
parking_lot = "0.12.5"
regex = "1.13.1"
csv = "1.4.0"
serde_yaml = "0.9.34"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal", "macros"] }
rust_decimal = "1.43.0"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
mongodb = "3.9.1"
redis = { version = "1.7.1", features = ["tokio-comp", "tokio-rustls-comp", "cluster-async"] }
kube = { version = "4.2.0", default-features = false, features = ["runtime", "client", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
tauri-plugin-dialog = { version = "2.8.2", optional = true }
tauri-plugin-fs = { version = "2.7.0", optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.64.1"
rust_xlsxwriter = { version = "0.99.1", features = ["constant_memory"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
flate2 = "1.1.10"
libc = "0.2.190"
ignore = "0.4.33"
calamine = { version = "0.36.1", features = ["dates"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
portable-pty = "0.9.0"
tauri-plugin-updater = { version = "2.14.0", optional = true }
time = { version = "0.3", features = ["formatting"] }
keepawake = "0.6.1"
# remote access from the DevCat mobile app (direct QUIC, see src/remote)
iroh = { version = "1.3.0", default-features = false, features = ["tls-aws-lc-rs", "fast-apple-datapath"] }
devcat-remote-proto = { path = "../crates/remote-proto", features = ["crypto"] }
devcat-harness = { path = "../crates/harness" }
tokio-tungstenite = "0.29"
getrandom = "0.3"
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }


# Dev builds: line numbers for our own code (readable backtraces) and no debug info for
# dependencies. Full debug info made target/debug grow by tens of GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind: a panic in a background task fails that task, not the whole app (and with it every
# VPN's management connection). Panics are logged by crashlog.rs.
panic = "unwind"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }
